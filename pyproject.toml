[project]
name = "llama-cpp-control-centre"
version = "0.1.0"
description = "Modern FastAPI web interface for managing llama.cpp models and servers"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ben Walker", email = "ben@example.com" }
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "llama-cpp-python[server]>=0.2.27",
    "huggingface-hub>=0.20.3",
    "aiohttp>=3.9.1",
    "aiofiles>=23.2.1",
    "httpx>=0.26.0",
    "psutil>=5.9.7",
    "pydantic>=2.5.3",
    "orjson>=3.9.12",
    "sse-starlette>=3.1.2",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.2",
]

